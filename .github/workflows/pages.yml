name: Deploy raffle generator to Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - MICR-LICENSE.txt
      - FONT-CREDITS.txt
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare standalone website
        run: |
          mkdir -p _site
          cp index.html MICR-LICENSE.txt FONT-CREDITS.txt _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
