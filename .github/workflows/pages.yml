name: Deploy raffle generator to Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - "*.js"
      - verify.html
      - SECURITY-GUIDE.txt
      - "vendor/**"
      - "fonts/**"
      - FONT-CREDITS.txt
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare standalone website
        run: |
          mkdir -p _site
          cp index.html verify.html secure-number.js ticket-crypto.js issuer.js pdf-export.js pdf-worker.js verify.js offline.js sw.js FONT-CREDITS.txt SECURITY-GUIDE.txt _site/
          cp -r vendor fonts _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
